<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Barac Escobar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">&lt;BE/&gt;</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="habilidades.html">Mis habilidades</a></li>
          <li class="nav-item"><a class="nav-link" href="proyectos.html">Mis proyectos</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container section page-top reveal">
    <h2 class="section-title">Contacto</h2>
    <div class="row g-4">
      <div class="col-md-5">
        <div class="card-dark p-4 h-100">
          <h5 class="text-neon">Hablemos</h5>
          <p>📧 correo@ejemplo.com</p>
          <p>💼 linkedin.com/in/tu-usuario</p>
          <p class="mb-0">🐙 github.com/tu-usuario</p>
        </div>
      </div>
      <div class="col-md-7">
        <div class="card-dark p-4">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
          </div>
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" placeholder="tu@correo.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="4" placeholder="Escribe tu mensaje"></textarea>
          </div>
          <button class="btn btn-neon">Enviar</button>
        </div>
      </div>
    </div>

  <footer class="footer text-center">
